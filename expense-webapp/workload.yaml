apiVersion: openchoreo.dev/v1alpha1
metadata:
  name: expense-webapp

endpoints:
  - name: http
    type: HTTP
    port: 9090
    basePath: /
    visibility:
      - project
      - external

dependencies:
  endpoints:
    - component: employees-submit-expense5721-expense-api
      name: http
      visibility: project
      envBindings:
        address: EXPENSE_API_URL
  resources:
    - ref: employees-submit-8ebd4e77
      envBindings:
        client_id: THUNDER_AUTH_CLIENT_ID
        issuer: THUNDER_AUTH_ISSUER
        jwks_url: THUNDER_AUTH_JWKS_URL
        scopes: THUNDER_AUTH_SCOPES
